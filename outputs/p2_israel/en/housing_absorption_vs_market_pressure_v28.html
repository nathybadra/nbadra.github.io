      up['margin.r'] = ORIG.margin.r; up['margin.b'] = ORIG.margin.b;
    }

    try { window.Plotly.relayout(g, up); } catch (e) {}
  }

  /* ── 2 · colocación de etiquetas ────────────────────────────────── */

  function hits(a, b, pad) {
    pad = pad || 0;
    return !(a.x1 + pad < b.x0 || b.x1 + pad < a.x0 ||
             a.y1 + pad < b.y0 || b.y1 + pad < a.y0);
  }

  function axOf(fl, ref) {                     /* 'x2' -> fl.xaxis2 */
    return fl[String(ref || 'x').replace(/^([xy])/, '$1axis')];
  }

  function declutter(g, b) {
    var fl = g._fullLayout;
    if (!fl || !fl.xaxis || !fl.xaxis.d2p) return;

    var occupied = [];      /* cajas ocupadas, por panel */
    var labels = [];

    /* Los rótulos de cuadrante son obstáculos: una etiqueta impresa
       sobre "PRESIÓN" es tan ilegible como sobre otra etiqueta. Su caja
       se calcula de sus propias coordenadas de dato, sin depender de
       ningún interno de Plotly. */
    ORIG.annots.forEach(function (a, i) {
      if (i < 3) return;                       /* los años van fuera del área */
      var xa = axOf(fl, a.xref), ya = axOf(fl, a.yref);
      if (!xa || !ya || !xa.d2p) return;
      var lines = String(a.text || '').split(/<br\s*\/?>|\n/);
      var longest = lines.reduce(function (m, s) { return Math.max(m, strip(s).length); }, 0);
      var w = longest * b.quadFs * 0.62 + 10;
      var h = lines.length * b.quadFs * 1.35 + 6;
      var cx = xa._offset + xa.d2p(a.x);
      var cy = ya._offset + ya.d2p(a.y);
      occupied.push({ x0: cx - w / 2, x1: cx + w / 2, y0: cy - h / 2, y1: cy + h / 2 });
    });

    var DIRS = [[0, -1], [1, -0.6], [-1, -0.6], [1, 0.4],
                [-1, 0.4], [0, 1], [1, 1], [-1, 1]];
    var RINGS = [7, 22, 38];

    g.data.forEach(function (tr, ti) {
      var texts = ORIG.texts[ti];
      if (!texts) return;

      var xa = axOf(fl, tr.xaxis || 'x'), ya = axOf(fl, tr.yaxis || 'y');
      if (!xa || !ya || !xa.d2p) return;

      var L = xa._offset, R = xa._offset + xa._length;
      var T = ya._offset, B = ya._offset + ya._length;

      var marks = [];
      for (var i = 0; i < tr.x.length; i++) {
        var mx = xa._offset + xa.d2p(tr.x[i]);
        var my = ya._offset + ya.d2p(tr.y[i]);
        var r = (Array.isArray(tr.marker.size) ? tr.marker.size[i] : tr.marker.size) / 2;
        marks.push({ x: mx, y: my, r: r,
                     x0: mx - r, x1: mx + r, y0: my - r, y1: my + r });
      }

      /* prioridad por prominencia visual del punto, no por criterio
         analítico: primero se coloca lo que más pesa en la figura */
      var idx = [];
      for (var j = 0; j < texts.length; j++) if (texts[j]) idx.push(j);
      idx.sort(function (p, q) { return marks[q].r - marks[p].r; });

      var fs = b.labelFs;

      idx.forEach(function (k) {
        var m = marks[k], label = texts[k];
        var w = label.length * fs * 0.53 + 5;
        var h = fs * 1.2;
        var best = null;

        for (var ri = 0; ri < RINGS.length && !best; ri++) {
          var rad = m.r + RINGS[ri];
          for (var di = 0; di < DIRS.length && !best; di++) {
            var d = DIRS[di];
            var cx = m.x + d[0] * (rad + w / 2);
            var cy = m.y + d[1] * (rad + h / 2);
            var box = { x0: cx - w / 2, x1: cx + w / 2, y0: cy - h / 2, y1: cy + h / 2 };

            if (box.x0 < L + 1 || box.x1 > R - 1 || box.y0 < T + 1 || box.y1 > B - 1) continue;

            var clash = false, p;
            for (p = 0; p < occupied.length && !clash; p++) clash = hits(box, occupied[p], 2);
            for (p = 0; p < marks.length && !clash; p++) clash = hits(box, marks[p], 1);
            if (clash) continue;

            best = { box: box, dx: cx - m.x, dy: cy - m.y, ring: ri };
          }
        }

        if (!best) return;             /* sin sitio: el nombre queda en el tooltip */
        occupied.push(best.box);

        var ann = {
          x: tr.x[k], y: tr.y[k],
          xref: tr.xaxis || 'x', yref: tr.yaxis || 'y',
          text: label,
          font: { size: fs, color: '#374151',
                  family: 'IBM Plex Sans, Arial, sans-serif' },
          xanchor: 'center', yanchor: 'middle',
          bgcolor: 'rgba(255,255,255,0.82)', borderpad: 1,
          captureevents: false
        };

        if (best.ring > 0) {
          /* línea guía: a esa distancia la etiqueta ya no se lee como
             perteneciente al punto. Con `showarrow` el texto se coloca
             con ax/ay, no con xshift/yshift. */
          ann.showarrow = true;
          ann.arrowhead = 0; ann.arrowwidth = 0.8; ann.arrowsize = 1;
          ann.arrowcolor = 'rgba(55,65,81,0.42)';
          ann.ax = best.dx; ann.ay = best.dy;
          ann.standoff = m.r + 2;
        } else {
          ann.showarrow = false;
          ann.xshift = best.dx;
          ann.yshift = -best.dy;       /* yshift positivo sube */
        }
        labels.push(ann);
      });
    });

    /* Se reemplaza el juego completo: las anotaciones publicadas —años y
       cuadrantes, que ocupan siempre las N_BASE primeras posiciones— más
       las etiquetas recién resueltas. */
    var keep = (g.layout.annotations || []).slice(0, N_BASE);
    try { window.Plotly.relayout(g, { annotations: keep.concat(labels) }); } catch (e) {}
  }

  function apply() {
    var g = gd();
    if (!g || !g.layout || !window.Plotly) return;
    if (!ORIG) capture(g);

    var w = g.clientWidth || window.innerWidth;
    var b = band(w);

    /* Se apagan las etiquetas propias de la traza: "top center" es la
       posición fija que producía las colisiones. Los nombres no se
       pierden: siguen en el tooltip. */
    try {
      window.Plotly.restyle(g, { mode: 'markers', text: [null, null, null] });
    } catch (e) {}

    applyLayout(g, b);
    /* La colocacion necesita la geometria YA recalculada. Se encadena con
       setTimeout y no con requestAnimationFrame: en un documento oculto
       -pestania en segundo plano, iframe fuera de pantalla- el navegador
       no entrega frames y las etiquetas no llegaban a colocarse nunca. */
    setTimeout(function () { declutter(g, b); }, 0);
    setTimeout(function () { declutter(g, b); }, 120);
  }

  var timer = null;
  function schedule() {
    clearTimeout(timer);
    timer = setTimeout(apply, 90);
  }

  function boot() {
    var g = gd();
    if (!g || !g.layout || !window.Plotly || !g._fullLayout) { setTimeout(boot, 120); return; }
    apply();
    window.addEventListener('resize', schedule, { passive: true });
    window.addEventListener('orientationchange', schedule, { passive: true });
    [400, 1100].forEach(function (ms) { setTimeout(apply, ms); });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
