   so the host never needs an internal scrollbar. */
(function(){
  function fit(){
    var d = document.querySelector('.plotly-graph-div');
    if(!d || !window.Plotly || !d._fullLayout) return false;
    window.Plotly.Plots.resize(d);
    return true;
  }
  var n=0, iv=setInterval(function(){ n++; if(fit() || n>200) clearInterval(iv); }, 60);
  window.addEventListener('resize', function(){ clearTimeout(window.__tfrz);
    window.__tfrz = setTimeout(fit, 120); });
  document.addEventListener('DOMContentLoaded', fit);

<script id="rl-resp2-balance-js">
/* ═══ SEGUNDA PASADA RESPONSIVE · 29 ago 2026 ═══════════════════════

   NO TOCA DATOS. No se altera ni un punto, ni una serie, ni una escala
   de valores. Lo que hace este bloque es exactamente tres cosas:

   1 · COBERTURA TEMPORAL. Medido sobre el propio gráfico: las cuatro
       trazas corren 2021-01-01 → 2024-12-01, 48 puntos mensuales, que
       son cuatro años exactos. El eje, en cambio, estaba en autorango
       y se extendía hasta 2025-09-15, dejando ~9 meses de lienzo vacío
       a la derecha, y el rótulo anunciaba "2021–2025". El rótulo ya se
       corrigió en el propio figure; aquí se cierra el eje en el último
       mes REPRESENTADO más medio mes de aire. No se recorta ningún
       dato: no había ninguno después de 2024-12.

   2 · ZONAS INDEPENDIENTES. La anotación "7 de octubre de 2023" estaba
       declarada con `yref:"paper", y:1, ay:-35`: es decir, su texto se
       dibujaba 35px POR ENCIMA del borde superior del área de dibujo,
       o sea dentro del margen donde vive el subtítulo. Por eso se
       montaba sobre "Serie mensual modelada a partir de totales
       anuales observados...". Aquí la anotación baja al interior del
       panel, colgando de su propia línea de quiebre. El subtítulo, la
       anotación de panel y el área de dibujo pasan a tener cada uno su
       banda, y ninguna puede invadir a la otra.

   3 · LEGIBILIDAD POR ANCHO. Cuerpos, márgenes, leyenda y ticks se
       recalculan por tramo, y el título se reparte en renglones en
       lugar de cortarse en el borde derecho.
   ═══════════════════════════════════════════════════════════════════ */
(function () {
  'use strict';

  var ORIG = null;   /* estado original, para poder restituirlo exacto */

  function gd() { return document.querySelector('.plotly-graph-div'); }

  function strip(h) {
    return String(h || '').replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim();
  }

  /* reparte un texto plano en renglones de como mucho `n` caracteres,
     sin partir palabras */
  function wrap(txt, n) {
    var words = txt.split(' '), lines = [], line = '';
    for (var i = 0; i < words.length; i++) {
      var probe = line ? line + ' ' + words[i] : words[i];
      if (probe.length > n && line) { lines.push(line); line = words[i]; }
      else { line = probe; }
    }
    if (line) lines.push(line);
    return lines;
  }

  function capture(g) {
    var L = g.layout;
    var t = (L.title && (L.title.text || L.title)) || '';
    var parts = String(t).split(/<br\s*\/?>/i);
    ORIG = {
      titleHtml: t,
      mainPlain: strip(parts[0] || ''),
      subPlain: strip(parts.slice(1).join(' ')),
      margin: JSON.parse(JSON.stringify(L.margin || {})),
      titleFont: JSON.parse(JSON.stringify((L.title && L.title.font) || {})),
      legend: JSON.parse(JSON.stringify(L.legend || {})),
      tickfont: JSON.parse(JSON.stringify(L.xaxis.tickfont || {})),
      annFonts: (L.annotations || []).map(function (a) {
        return (a.font && a.font.size) || 12;
      })
    };
  }

  /* tramos. `null` en un campo = se restituye el valor original. */
  function band(w) {
    if (w < 480) return {
      titleFs: 12.5, subFs: 9.5, mainWrap: 30, subWrap: 44,
      m: { l: 46, r: 12, b: 104 }, legendFs: 10, legendY: -0.155,
      tickFs: 9.5, panelFs: 10.5, cutFs: 9.5, cutAx: 10, cutAy: 34
    };
    if (w < 768) return {
      titleFs: 14, subFs: 10, mainWrap: 44, subWrap: 62,
      m: { l: 50, r: 18, b: 88 }, legendFs: 10.5, legendY: -0.135,
      tickFs: 10.5, panelFs: 11.5, cutFs: 10, cutAx: 14, cutAy: 32
    };
    if (w < 1024) return {
      titleFs: 15.5, subFs: 10.5, mainWrap: 78, subWrap: 118,
      m: { l: 54, r: 22, b: 74 }, legendFs: 11, legendY: -0.105,
      tickFs: 11, panelFs: 12.5, cutFs: 10.5, cutAx: 16, cutAy: 30
    };
    return null;   /* escritorio: tal cual se publicó */
  }

  function apply() {
    var g = gd();
    if (!g || !g.layout || !window.Plotly) return;
    if (!ORIG) capture(g);

    var w = g.clientWidth || window.innerWidth;
    var b = band(w);
    var up = {};

    /* ── 1 · cobertura temporal ─────────────────────────────────────
       Se calcula del propio dato, no de una constante escrita a mano:
       si algún día la serie llega más lejos, el eje la sigue sola. */
    var last = null, first = null;
    (g.data || []).forEach(function (tr) {
      if (!tr.x || !tr.x.length) return;
      var a = new Date(tr.x[0]), z = new Date(tr.x[tr.x.length - 1]);
      if (!first || a < first) first = a;
      if (!last || z > last) last = z;
    });
    if (first && last) {
      var lo = new Date(first.getTime()); lo.setDate(lo.getDate() - 20);
      var hi = new Date(last.getTime());  hi.setDate(hi.getDate() + 20);
      var iso = function (d) { return d.toISOString().slice(0, 10); };
      up['xaxis.range'] = [iso(lo), iso(hi)];
      up['xaxis2.range'] = [iso(lo), iso(hi)];
    }

    /* ── 2 · zonas independientes ───────────────────────────────────
       La anotación del quiebre se ancla al dominio del panel, no al
       papel, y su texto cuelga HACIA ABAJO (ay > 0). Así no puede
       volver a subir al margen del subtítulo. */
    (g.layout.annotations || []).forEach(function (a, i) {
      var isCut = a.xref && String(a.xref).charAt(0) === 'x' && a.showarrow;
      if (isCut) {
        up['annotations[' + i + '].yref'] = 'y domain';
        up['annotations[' + i + '].y'] = 1;
        up['annotations[' + i + '].ay'] = b ? b.cutAy : 30;
        up['annotations[' + i + '].ax'] = b ? b.cutAx : 20;
        up['annotations[' + i + '].font.size'] = b ? b.cutFs : ORIG.annFonts[i];
        up['annotations[' + i + '].bgcolor'] = 'rgba(255,255,255,0.86)';
        up['annotations[' + i + '].borderpad'] = 2;
      } else {
        up['annotations[' + i + '].font.size'] = b ? b.panelFs : ORIG.annFonts[i];
      }
    });

    /* ── 3 · legibilidad por ancho ──────────────────────────────────
       El título se reparte en renglones: antes se cortaba en el borde
       derecho ("...retornos y emigraci"). El margen superior se calcula
       a partir del número de renglones que realmente ocupa, para que
       la anotación de panel nunca quede debajo del subtítulo. */
    if (b) {
      var mainLines = wrap(ORIG.mainPlain, b.mainWrap);
      var subLines = wrap(ORIG.subPlain, b.subWrap);
      up['title.text'] =
        '<b>' + mainLines.join('<br>') + '</b><br>' +
        '<span style="font-size:' + b.subFs + 'px;color:#6B7280">' +
        subLines.join('<br>') + '</span>';
      up['title.font.size'] = b.titleFs;

      /* El titulo se ancla al borde superior del CONTENEDOR, no al area
         de dibujo. Sin esto Plotly lo coloca en una fraccion del margen
         y su alto real depende del numero de renglones, que es
         justamente lo que cambia por tramo. */
      up['title.yref'] = 'container';
      up['title.y'] = 1;
      up['title.yanchor'] = 'top';
      up['title.pad'] = { t: 12, b: 0, l: 0, r: 0 };

      /* Primera estimacion del margen superior. La definitiva se mide
         sobre el titulo ya dibujado, en `reflowTop()`: estimar alturas
         de texto a ojo es exactamente el error que dejaba el subtitulo
         encima de la anotacion de panel a 390px. */
      var top = 12
        + mainLines.length * (b.titleFs * 1.34)
        + subLines.length * (b.subFs * 1.45)
        + (b.panelFs * 2.7);
      up['margin.t'] = Math.round(top);
      up['margin.l'] = b.m.l;
      up['margin.r'] = b.m.r;
      up['margin.b'] = b.m.b;

      up['legend.font.size'] = b.legendFs;
      up['legend.y'] = b.legendY;
      up['xaxis.tickfont.size'] = b.tickFs;
      up['xaxis2.tickfont.size'] = b.tickFs;
      up['yaxis.tickfont.size'] = b.tickFs;
      up['yaxis2.tickfont.size'] = b.tickFs;
      up['xaxis.nticks'] = w < 480 ? 5 : 7;
      up['xaxis2.nticks'] = w < 480 ? 5 : 7;
    } else {
      up['title.text'] = ORIG.titleHtml;
      up['title.font.size'] = ORIG.titleFont.size || 17;
      /* se devuelve el anclaje que traia publicado */
      up['title.yref'] = 'container';
      up['title.y'] = null;
      up['title.yanchor'] = null;
      up['title.pad'] = { t: 0, b: 0, l: 0, r: 0 };
      up['margin.t'] = ORIG.margin.t;
      up['margin.l'] = ORIG.margin.l;
      up['margin.r'] = ORIG.margin.r;
      up['margin.b'] = ORIG.margin.b;
      up['legend.font.size'] = (ORIG.legend.font && ORIG.legend.font.size) || 11.5;
      up['legend.y'] = ORIG.legend.y;
      up['xaxis.tickfont.size'] = ORIG.tickfont.size || null;
      up['xaxis2.tickfont.size'] = ORIG.tickfont.size || null;
      up['yaxis.tickfont.size'] = ORIG.tickfont.size || null;
      up['yaxis2.tickfont.size'] = ORIG.tickfont.size || null;
      up['xaxis.nticks'] = null;
      up['xaxis2.nticks'] = null;
    }

    try { window.Plotly.relayout(g, up); } catch (e) {}
    if (b) reflowTop(g, b);
  }

  /* ── Segunda pasada: el margen superior se MIDE ────────────────────
     Se lee la caja real del titulo ya compuesto y se reserva por debajo
     una banda propia para la anotacion de panel, que Plotly dibuja
     pegada al borde superior del area con `yanchor:"bottom"`. Mientras
     el margen se estimaba a ojo, a 390px el tercer renglon del
     subtitulo caia justo encima de "Flujos migratorios mensuales". */
  function reflowTop(g, b) {
    var t = g.querySelector('.g-gtitle');
    if (!t || !t.getBBox) return;
    var h;
    try { h = t.getBBox().height; } catch (e) { return; }
    if (!h) return;

    var need = Math.round(12 + h + 8 + b.panelFs * 2.7);
    var have = (g.layout.margin && g.layout.margin.t) || 0;
    if (Math.abs(need - have) < 3) return;
    try { window.Plotly.relayout(g, { 'margin.t': need }); } catch (e) {}
  }

  /* Se planifica con setTimeout y no con requestAnimationFrame: en un
     documento oculto -pestania en segundo plano, iframe fuera de
     pantalla- el navegador no entrega frames, y el ajuste no llegaba
     a ejecutarse nunca. */
  var timer = null;
  function schedule() {
    clearTimeout(timer);
    timer = setTimeout(apply, 90);
  }

  function boot() {
    var g = gd();
    if (!g || !g.layout || !window.Plotly) { setTimeout(boot, 120); return; }
    apply();
    window.addEventListener('resize', schedule, { passive: true });
    window.addEventListener('orientationchange', schedule, { passive: true });
    [300, 900].forEach(function (ms) { setTimeout(apply, ms); });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
